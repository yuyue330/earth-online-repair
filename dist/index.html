<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>地球 ONLINE · 售后服务</title>
<style>
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05060f;font-family:monospace;}
  body{height:100vh;height:var(--app-height,100dvh);min-height:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;position:relative;background:radial-gradient(ellipse at center,#151b43 0%,#0b1028 58%,#05060f 100%);}
  #game{
    display:block;
    min-width:0;min-height:0;
    width:min(100%,calc((var(--app-height,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.5),1600px);
    aspect-ratio:3/2;
    height:auto;
    max-height:calc(var(--app-height,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    border:3px solid #2a2f5a;
    background:#05060f;
    border-radius:4px;
    cursor:pointer;
    touch-action:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    box-shadow:0 0 40px rgba(11,16,48,.72);
  }
  body.portrait #game{width:100%;height:100%;max-height:none;aspect-ratio:auto;border:0;border-radius:0;}
  #orientation-hint[hidden]{display:none;}
  #orientation-hint{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(5,10,25,.91);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e4edf5;}
  .orientation-card{width:min(100%,360px);max-height:calc(var(--app-height,100dvh) - 40px);overflow-y:auto;padding:28px 24px 22px;background:linear-gradient(155deg,#1c3048,#101d34);border:2px solid #617c8a;box-shadow:6px 6px 0 #080e20;text-align:center;}
  .orientation-phone{width:82px;height:48px;border:3px solid #e9d39e;margin:6px auto 26px;position:relative;transform:rotate(-8deg);box-shadow:0 0 30px #e9d39e12;}
  .orientation-phone:before{content:"";position:absolute;inset:6px 11px;background:linear-gradient(#1c2b4e 55%,#537464 56%);border:1px solid #678597;}
  .orientation-phone:after{content:"✦";position:absolute;top:8px;left:39px;color:#ffe2a0;font-size:13px;}
  .orientation-card h1{font-size:23px;line-height:1.4;color:#ffe2a0;margin:0 0 12px;}
  .orientation-card p{font-size:15px;line-height:1.85;margin:0;color:#b9cada;}
  .choice-button{width:100%;min-height:48px;margin:14px 0 0;padding:10px;background:#436e82;color:#fff0d2;border:1px solid #8aa6b4;border-radius:0;font:600 16px -apple-system,"PingFang SC",sans-serif;touch-action:manipulation;}
  .choice-button.secondary{background:#273b55;color:#d8e3eb;}
  .orientation-option{margin-top:16px;padding:11px 12px 10px;border:1px solid #536c80;background:#172941;text-align:left;}
  .orientation-option strong{display:block;color:#ffe2a0;font-size:15px;margin-bottom:4px;}
  .orientation-option span{display:block;color:#b9cada;font-size:13px;line-height:1.55;}
  .orientation-option+.choice-button{margin-top:7px;}
  #orientation-hint.rotating .orientation-option{display:none;}
  .choice-link{margin:15px 4px 0;padding:8px;border:0;background:none;color:#b0c9d7;font:13px -apple-system,"PingFang SC",sans-serif;min-height:36px;}
  #orientation-hint.rotating .orientation-phone{width:44px;height:76px;animation:turn-phone 2.8s ease-in-out infinite;}
  #orientation-hint.rotating .orientation-phone:before{inset:7px;}
  #orientation-hint.rotating .orientation-phone:after{left:16px;top:20px;}
  @keyframes turn-phone{0%,15%{transform:rotate(0)}60%,90%{transform:rotate(90deg)}100%{transform:rotate(0)}}
  #orientation-hint.rotate-portrait .orientation-phone{animation-direction:reverse;}
  #audio-panel[hidden]{display:none;}
  #audio-panel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(5,10,25,.94);font-family:-apple-system,"PingFang SC",sans-serif;color:#dce7ed;}
  #audio-panel .orientation-card{text-align:left;}
  #audio-panel h2{font-size:22px;color:#ffe2a0;margin:0 0 12px;}
  #audio-panel p{font-size:14px;line-height:1.75;margin:8px 0;}
  #audio-status{color:#a4d8cb;min-height:48px;}
  @media(max-height:500px){.orientation-card{padding:16px 20px;}.orientation-phone{margin:0 auto 12px;}.orientation-card h1{font-size:21px;}.choice-button{margin-top:9px;}}
  @media(prefers-reduced-motion:reduce){#orientation-hint.rotating .orientation-phone{animation:none;transform:rotate(90deg);}}
  .orientation-card small{font-size:12px;line-height:1.7;color:#91a5b8;}
</style>
</head>
<body>
<canvas id="game" width="360" height="240"></canvas>
<div id="orientation-hint" role="dialog" aria-modal="true" aria-labelledby="orientation-title" hidden>
  <div class="orientation-card"><div class="orientation-phone" aria-hidden="true"></div><h1 id="orientation-title">选择今晚的售后方式</h1><p id="orientation-copy">地球 ONLINE 的工单已送达。<br>选个顺手的方式，开始今晚的维修吧。</p><div class="orientation-option"><strong>竖屏 · 掌心巡修</strong><span>把维修地图握在掌心，走近每一处等待修好的风景。</span></div><button id="continue-portrait" class="choice-button" type="button">竖屏开始维修</button><div class="orientation-option"><strong>横屏 · 夜空巡修</strong><span>展开更宽的视野，看看夜空、地图和旅途中的沿途景色。</span></div><button id="choose-landscape" class="choice-button" type="button">横屏开始维修</button><button id="orientation-back" class="choice-link" type="button" hidden>重新选择</button><button class="choice-link" type="button" onclick="openAudioPanel()">声音检查与试听</button><p><small id="orientation-footnote">两种方式都能完成同一段旅程。</small></p></div>
</div>
<div id="audio-panel" role="dialog" aria-modal="true" aria-labelledby="audio-title" hidden><div class="orientation-card"><h2 id="audio-title">听听今晚的声音</h2><p id="audio-status" role="status" aria-live="polite">点击下方按钮，启用并试听声音。</p><button id="audio-enable" class="choice-button" type="button" onclick="testGameAudio('effects')">启用声音 · 试听音效</button><button class="choice-button secondary" type="button" onclick="testGameAudio('music')">试听背景音乐</button><button class="choice-button secondary" type="button" onclick="testGameAudio('voice')">试听剧情配音</button><p>仍听不到时，请检查媒体音量、静音模式及蓝牙耳机连接。也可以在手机浏览器中打开后再试一次。</p><button id="audio-close" class="choice-button secondary" type="button" onclick="closeAudioPanel()">返回游戏</button></div></div>
<script src="story-voice-index.js?v=1101-03"></script>
<script>
const cv=document.getElementById('game'), screenCtx=cv.getContext('2d');
const pixelCanvas=document.createElement('canvas');pixelCanvas.width=360;pixelCanvas.height=240;
const ctx=pixelCanvas.getContext('2d');
const W=360,H=240;
let portraitMode=false,portraitHeight=640;
let orientationHintOpen=false,orientationHintDismissed=false,orientationHintShown=false,orientationWanted=null,audioPanelOpen=false;
try{orientationHintDismissed=sessionStorage.getItem('earthOnlineRepair_orientation_hint_v3')==='1';}catch(_){}
const orientationHint=document.getElementById('orientation-hint');
function dismissOrientationHint(){orientationHintDismissed=true;orientationHintOpen=false;orientationHint.hidden=true;try{sessionStorage.setItem('earthOnlineRepair_orientation_hint_v3','1');}catch(_){}if(window.mobileLayoutReady){gameFocused=true;bgmSync();}}
function chooseOrientation(mode){unlockAudio();orientationWanted=mode;if((mode==='portrait')===portraitMode){dismissOrientationHint();return;}orientationHintDismissed=false;updateOrientationHint();}
document.getElementById('choose-landscape').addEventListener('click',()=>chooseOrientation('landscape'));
document.getElementById('continue-portrait').addEventListener('click',()=>chooseOrientation('portrait'));
document.getElementById('orientation-back').addEventListener('click',()=>{orientationWanted=null;updateOrientationHint();});
function showOrientationChoice(){orientationHintDismissed=false;orientationWanted=null;updateOrientationHint();}
function updateOrientationHint(){
  const phone=(navigator.maxTouchPoints>0&&Math.max(innerWidth,innerHeight)<1400)||innerWidth<=600;
  if(orientationWanted&&!orientationHintDismissed&&(orientationWanted==='portrait')===portraitMode){dismissOrientationHint();return;}
  orientationHintOpen=phone&&!orientationHintDismissed;orientationHint.hidden=!orientationHintOpen;
  if(!orientationHintOpen)return;orientationHintShown=true;
  const waiting=!!orientationWanted,toPortrait=orientationWanted==='portrait';orientationHint.classList.toggle('rotating',waiting);orientationHint.classList.toggle('rotate-portrait',toPortrait);
  document.getElementById('orientation-title').textContent=waiting?(toPortrait?'请把手机竖过来':'请把手机横过来'):'选择今晚的售后方式';
  document.getElementById('orientation-copy').innerHTML=waiting?'转动手机后会自动继续。<br>如果画面没有转动，请检查手机的屏幕旋转锁定。':'地球 ONLINE 的工单已送达。<br>选个顺手的方式，开始今晚的维修吧。';
  document.getElementById('choose-landscape').hidden=waiting&&!toPortrait;
  document.getElementById('continue-portrait').hidden=waiting&&toPortrait;
  document.getElementById('choose-landscape').textContent=waiting?'改用横屏维修':'横屏开始维修';
  document.getElementById('continue-portrait').textContent=waiting?'改用竖屏维修':'竖屏开始维修';
  document.getElementById('orientation-back').hidden=!waiting;
}
function fitCanvas(){
  document.documentElement.style.setProperty('--app-height',Math.round(Math.min(innerHeight,window.visualViewport?.height||innerHeight))+'px');
  const next=innerHeight>innerWidth&&innerWidth<=900&&(navigator.maxTouchPoints>0||innerWidth<=600);
  if(window.mobileLayoutReady)mobileLayoutChanged();
  portraitMode=next;document.body.classList.toggle('portrait',portraitMode);
  updateOrientationHint();
  const rect=cv.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const pw=Math.max(1,Math.round(rect.width*dpr));
  const ph=Math.max(1,Math.round(rect.height*dpr));
  if(cv.width!==pw||cv.height!==ph){ cv.width=pw; cv.height=ph; }
  const renderH=portraitMode?Math.round(pw*H/W):ph;
  portraitHeight=ph/pw*W;
  if(pixelCanvas.width!==pw||pixelCanvas.height!==renderH){pixelCanvas.width=pw;pixelCanvas.height=renderH;}
  screenCtx.setTransform(1,0,0,1,0,0); screenCtx.imageSmoothingEnabled=false;
  ctx.setTransform(pw/W,0,0,renderH/H,0,0);
  ctx.imageSmoothingEnabled=false;   // 只影响 drawImage(月亮)，让 2x 离屏图缩放后边缘平滑
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
window.addEventListener('load', fitCanvas);
window.visualViewport?.addEventListener('resize',fitCanvas);
fitCanvas();
const skyX=W*0.74, skyY=H*0.24;
const workerX=88;
const nearX=152, nearY=H*0.46;
let scene='start', shells=0, time=0, last=performance.now();
let collection=new Set();    // 第一章 · 夜空七处
// 第二章 · 沙漠七处。和第一章**分开两个集合**，不合并：
// 收集册要分页、结局判定各管各的，混在一起后患无穷（见设计案 10.1）。
let collection2=new Set();
let desertEndingSeen=false, ch2Progress={};
// 所有道具的"未拥有"默认表。新增道具只改这一处，
// loadState / clearSave 会自动带上——否则老存档读进来新道具会是 undefined，门控直接放行。
const NO_TOOLS={washer:false, icecream:false, rocket:false, rope:false, lotus:false, paddle:false,
                spade:false, hide:false, fan:false, waterskin:false, bell:false, cord:false, sling:false};
let owned=Object.assign({},NO_TOOLS);
let toast=null;
let navReturn='map';
let fade=1;          // 场景切换淡入
let lastEarn=0;      // 本次关卡实际拿到的贝壳（已修过则为 0）
const BUILD='build 1102-02 · 月光有回声';   // 开始界面右下角显示，用来确认看到的是哪一版
// 网址带 ?fresh=1 → 既不读也不写存档，每次都是全新的一晚（预览/测试用）
// 另有两条"预览直达"，同样不留痕迹（都归进 FRESH，就不用再各自加一遍守卫）：
//   ?full=1    七处全部标记为已修好，直接落在地图（看解锁的路牌、收集册 7/7）
//   ?ending=1  直接播第一章小结局（截图 / 演示 / 给朋友看结局用）
//   ?sea=1     直接进大海关卡，且船桨已经在手（调某一关的手感时不用先打五关）
//   ?lake=1    直接进湖泊关卡，拟音箱已到手（不读写正式存档）
//   ?tree=1    直接进森林关卡，树冠修补包已到手
//   ?mountain=1 / ?dipper=1    直接试玩新版群山 / 北斗
//   ?ch2=1     直接播第二章过渡剧情（改台词时不用先打完第一章）
//   ?desert=1  直接落在沙漠地图（看配色和布局，七处完整维修）
// 只在显式带参数时生效，正常玩永远不会触发。
const PREVIEW_FULL   = (typeof location!=='undefined' && /[?&](full|ending)=1/.test(location.search));
const PREVIEW_ENDING = (typeof location!=='undefined' && /[?&]ending=1/.test(location.search));
// sea 单独一条，不并进上面的 full|ending：?sea=1 要的是"干净的一关"，
// 而 PREVIEW_FULL 会把七处全标成已修好，大海就直接是 done 状态了。
const PREVIEW_SEA    = (typeof location!=='undefined' && /[?&]sea=1/.test(location.search));
// lake 和 sea 一样单独一条，理由相同：它要的是"干净的一关"，不能并进 PREVIEW_FULL
// （并了的话七处已修好，湖泊进去就是 done 状态）。
const PREVIEW_LAKE   = (typeof location!=='undefined' && /[?&]lake=1/.test(location.search));
const PREVIEW_TREE   = (typeof location!=='undefined' && /[?&]tree=1/.test(location.search));
// ch2 / desert 同理单独两条。?ch2=1 看的是"刚修完第一章"那一刻的过渡剧情，
// 所以它**不能**并进 PREVIEW_FULL（并了的话第一章七处已修好，前情就不对了）。
const PREVIEW_CH2    = (typeof location!=='undefined' && /[?&]ch2=1/.test(location.search));
const PREVIEW_DESERT = (typeof location!=='undefined' && /[?&]desert=1/.test(location.search));
const PREVIEW_MOUNTAIN=/[?&]mountain=1/.test(location.search);
const PREVIEW_DIPPER=/[?&]dipper=1/.test(location.search);
const DESERT_PREVIEW=/[?&](play2|album2|final2|memory2|shop2)=/.test(location.search);
const FRESH = (typeof location!=='undefined' && (/[?&]fresh=1/.test(location.search) || PREVIEW_FULL || PREVIEW_SEA || PREVIEW_LAKE || PREVIEW_TREE || PREVIEW_CH2 || PREVIEW_DESERT || PREVIEW_MOUNTAIN || PREVIEW_DIPPER || DESERT_PREVIEW));
const SAVE_KEY='earthOnlineRepair_save_v1';
// 第一章小结局是否已经"自动播过"。只挡自动触发——看完还能在收集册里重看，
// 所以这里不写进 saveState，清档时要单独删（漏了这句会变成"清档后永远看不到结局"）。
const ENDING_KEY='earthOnlineRepair_ending_v1';
// 第二章过渡剧情是否已经播过。和 TUT_KEY 一样是"看过就不再播"的标记，
// 不进 saveState（它不是进度，是"这一幕看过没有"），清档时要单独删。
const CH2_KEY='earthOnlineRepair_ch2intro_v2';
let ch2IntroSeenThisSession=false;
// 结局是否已经看过。注意 PREVIEW_FULL 不再强行返回 true ——
// 现在地图已经不自动播结局了（改成"引导去收集册验收"），所以 ?full=1 该看到的是
// "待验收"那个状态，不然没法预览这条新流程。FRESH 本身已经会返回 false。
function seenEnding(){ if(FRESH) return false; try{ return !!localStorage.getItem(ENDING_KEY); }catch(e){ return false; } }
function markEnding(){ if(FRESH) return; try{ localStorage.setItem(ENDING_KEY,'1'); }catch(e){} }
// collection2 走 d.collection2||[] 的默认值合并：老存档里没有这个字段，
// 读进来要是 undefined，后面 collection2.has() 会当场炸。新增收集集必须走这套。
function saveState(){ if(FRESH) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify({shells, collection:[...collection], collection2:[...collection2], owned, desertEndingSeen, ch2Progress, travelerMet})); }catch(e){} }
function loadState(){ if(FRESH) return; try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return; const d=JSON.parse(raw); shells=typeof d.shells==='number'?d.shells:0; collection=new Set(d.collection||[]); collection2=new Set(d.collection2||[]); owned=Object.assign({},NO_TOOLS, d.owned||{}); travelerMet=!!d.travelerMet; desertEndingSeen=!!d.desertEndingSeen; ch2Progress=d.ch2Progress&&typeof d.ch2Progress==='object'?d.ch2Progress:{}; }catch(e){} }

// ---------- 极简音频：全部程序化合成，不引入任何音频素材（守住"单文件零依赖"）----------
// 三层：
//   ① SFX  动作音效（tone / noiseBurst）
//   ② BGM  背景音乐（和弦垫 + 稀疏琶音，调度器提前排程，不是定时器里直接响）
//   ③ 配音 剧情语音（浏览器内置语音合成，系统没中文语音就静默跳过）
// 三个开关都要受 FRESH 管辖——加一个开关就重新 grep 一遍 localStorage，漏一处就污染正式存档。
const MUTE_KEY='earthOnlineRepair_mute_v1';
const BGM_KEY ='earthOnlineRepair_bgm_v1';
const VOICE_KEY='earthOnlineRepair_voice_v1';
function readFlag(key,def){ if(FRESH) return def; try{ const v=localStorage.getItem(key); return v===null?def:v==='1'; }catch(e){ return def; } }
function writeFlag(key,on){ if(FRESH) return; try{ localStorage.setItem(key,on?'1':'0'); }catch(e){} }
let muted =readFlag(MUTE_KEY,false);   // true = 静音（沿用旧存档语义：'1' 即静音）
let bgmOn =readFlag(BGM_KEY,true);
let voiceOn=readFlag(VOICE_KEY,true);
function saveMute(){ writeFlag(MUTE_KEY,muted); }
function saveBgm(){ writeFlag(BGM_KEY,bgmOn); }
function saveVoice(){ writeFlag(VOICE_KEY,voiceOn); }
let AC=null;
let audioHealth='idle',audioNeedsGesture=true,audioHasUserGesture=false,audioResumeTask=null,audioResumeSerial=0,audioTestUtterance=null,audioReturnFocus=null;
function audioMessage(message){document.getElementById('audio-status').textContent=message;}
function actx(){
  if(AC&&AC.state==='closed'){AC=null;if(bgmTimer)clearInterval(bgmTimer);bgmTimer=null;bgmGain=null;waterAudio.source=null;waterAudio.gain=null;waterAudio.pan=null;}
  if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();AC.addEventListener('statechange',()=>{if(!AC)return;if(AC.state==='running'){audioHealth='running';audioNeedsGesture=false;}else{audioNeedsGesture=true;audioHealth='paused';}});}catch(_){AC=false;audioHealth='unavailable';}}
  return AC||null;
}
function resumeAudio(fromGesture=false,force=false){
  if(fromGesture){audioHasUserGesture=true;try{if(navigator.audioSession&&(!muted||bgmOn||voiceOn))navigator.audioSession.type='playback';}catch(_){}}
  const ac=actx();if(!ac){audioMessage('当前浏览器未能启动声音，请尝试在手机浏览器中打开。');return Promise.resolve(false);}
  if(ac.state==='running'){audioHealth='running';audioNeedsGesture=false;return Promise.resolve(true);}
  if(!fromGesture){if(audioResumeTask)return audioResumeTask;if(audioNeedsGesture&&!force)return Promise.resolve(false);}
  const serial=++audioResumeSerial;audioHealth='starting';let operation;
  try{operation=ac.resume();if(fromGesture){const src=ac.createBufferSource();src.buffer=ac.createBuffer(1,1,ac.sampleRate);src.connect(ac.destination);src.start();}}catch(_){operation=Promise.reject(new Error('audio blocked'));}
  audioResumeTask=new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);const ok=ac.state==='running';if(serial===audioResumeSerial){audioHealth=ok?'running':'blocked';audioNeedsGesture=!ok;audioResumeTask=null;if(!ok&&audioPanelOpen)audioMessage('声音还未启动。请再次点击「启用声音」，并检查手机音量或静音模式。');}resolve(ok);};const timer=setTimeout(finish,1800);Promise.resolve(operation).then(finish,finish);});
  return audioResumeTask;
}
function openAudioPanel(){audioReturnFocus=document.activeElement;audioPanelOpen=true;pauseInput();stopSpeak();document.getElementById('audio-panel').hidden=false;audioMessage(AC?.state==='running'?'声音引擎已启动。点击试听，确认手机是否能听见。':'点击「启用声音」后试听，确认手机是否能听见。');document.getElementById('audio-enable').focus();}
function closeAudioPanel(){stopSpeak();audioTestUtterance=null;audioPanelOpen=false;document.getElementById('audio-panel').hidden=true;gameFocused=true;bgmSync();audioReturnFocus?.focus?.();}
async function testGameAudio(kind){
  if(kind==='voice'){
    if(!voiceOn){audioMessage('剧情配音已关闭，请先在游戏声音设置中打开。');return;}
    unlockAudio();audioMessage('正在载入本地剧情配音…');speakLine('欢迎来到地球售后服务中心。今晚的风景，拜托你了。','sys');return;
  }

// ---------- 离屏月亮（2x 分辨率 + arc 渲染，充气时不再一跳一跳）----------
const MC=220, MS=2, moonCv=document.createElement('canvas'); moonCv.width=MC; moonCv.height=MC;
const mctx=moonCv.getContext('2d');
function mpx(x,y,c){ mctx.fillStyle=c; mctx.fillRect((x*MS)|0,(y*MS)|0,MS,MS); }
function mcircle(cx,cy,r,c){ mctx.fillStyle=c; mctx.beginPath(); mctx.arc(cx*MS,cy*MS,r*MS,0,6.2832); mctx.fill(); }
// 反查表：给定"想要的亮面占比 L"，求两等圆挖除时的圆心偏移比 x(0..1)。
// 挖除面积 A(x)=2R²(acos x - x√(1-x²))，亮面 L=1-A/(πR²)。二分 28 次预计算 65 档。
const CARVE_LUT=(()=>{ const n=65,t=new Float32Array(n);
  for(let i=0;i<n;i++){ const L=i/(n-1); let lo=0,hi=1;
    for(let it=0;it<28;it++){ const m=(lo+hi)/2, v=1-(2/Math.PI)*(Math.acos(m)-m*Math.sqrt(1-m*m)); if(v<L) lo=m; else hi=m; }
    t[i]=(lo+hi)/2; }
  return t; })();
function carveX(L){ L=L<0?0:(L>1?1:L); const p=L*(CARVE_LUT.length-1), i=Math.min(CARVE_LUT.length-2,p|0), f=p-i; return CARVE_LUT[i]+(CARVE_LUT[i+1]-CARVE_LUT[i])*f; }
// prog 0→1：细月牙 → 满月（亮面占比 ≈ 8%+92%*prog，线性，不再提前变满）；bulge 0→1：过充鼓胀偏红
function buildMoon(prog,bulge){
  mctx.clearRect(0,0,MC,MC);
  bulge=bulge||0;
  const ox=55,oy=55;
  const r=11+19*prog+9*bulge;
  const glow=Math.max(0,(prog-0.45)/0.55);   // 月牙阶段不画光晕
  if(glow>0.01){
    // 三层递减柔光（外淡内亮），再挖掉 r 以内，避免留下一圈死板的灰环
    const g=0.42*glow;
    mctx.globalAlpha=g*0.22; mcircle(ox,oy,r+7,'#ffd75e');
    mctx.globalAlpha=g*0.34; mcircle(ox,oy,r+4.5,'#ffdf70');
    mctx.globalAlpha=g*0.55; mcircle(ox,oy,r+2,'#ffe98c');
    mctx.globalCompositeOperation='destination-out'; mcircle(ox,oy,r,'#000'); mctx.globalCompositeOperation='source-over';
    mctx.globalAlpha=1;
  }
  mcircle(ox,oy,r,'#ffe066');
  if(prog<0.9985){ const off=2*carveX(0.08+0.92*prog)*r; mctx.globalCompositeOperation='destination-out'; mcircle(ox+off,oy,r,'#000'); mctx.globalCompositeOperation='source-over'; }
  if(prog>0.5){ mpx(ox-7,oy-5,'#f5c518'); mpx(ox+6,oy+6,'#f5c518'); mpx(ox-2,oy+10,'#f5c518'); }
  if(bulge>0.02){ mctx.globalAlpha=Math.min(0.5,bulge*0.55); mcircle(ox,oy,r,'#ff5a5a'); mctx.globalAlpha=1; }
}

function makePaint(pts, fill){
  return { pts, marked:new Set(), bubbles:[], value:0, fill,
    paint(px_,py_){ for(let i=0;i<this.pts.length;i++){ if(!this.marked.has(i) && Math.hypot(this.pts[i][0]-px_,this.pts[i][1]-py_)<13){ this.marked.add(i); this.bubbles.push({x:this.pts[i][0],y:this.pts[i][1],life:1,a:Math.random()*6.28}); } } this.value=this.marked.size/this.pts.length; },
    draw(){ this.pts.forEach((p,i)=>{ if(this.marked.has(i)){ ctx.globalAlpha=0.92; circle(p[0],p[1],3.4,this.fill); } }); this.bubbles.forEach(b=>{ ctx.globalAlpha=Math.max(0,b.life)*0.7; circle(b.x,b.y,2,'#fff'); }); ctx.globalAlpha=1; }
  };
}
const CLOUD_PUFFS=[[0,0,30],[-26,-6,22],[26,-4,22],[-14,10,24],[16,10,24],[0,-16,22]];
function cloudFoamPts(){const pts=[];for(let y=-35;y<=35;y+=7)for(let x=-49;x<=49;x+=7)if(CLOUD_PUFFS.some(([cx,cy,r])=>Math.hypot(x-cx,y-cy)<r-2))pts.push([nearX+x,nearY+y]);return pts;}
function makeCloudFoam(){const foam=makePaint(cloudFoamPts(),'#fff9ed');foam.draw=function(){ctx.save();ctx.beginPath();CLOUD_PUFFS.forEach(([x,y,r])=>{ctx.moveTo(nearX+x+r,nearY+y);ctx.arc(nearX+x,nearY+y,r,0,Math.PI*2);});ctx.clip();this.pts.forEach((p,i)=>{if(this.marked.has(i))circle(p[0],p[1],6,i%4?'#fff8ee':'#e6f0ed');});ctx.restore();};return foam;}
function mountainIcePts(){
  const ax=180, ay=104, bl=42, by=164; const pts=[];
  for(let y=108;y<=162;y+=5){ const t=(y-ay)/(by-ay); const halfw=bl*t-3; for(let x=Math.ceil(ax-halfw);x<=ax+halfw;x+=5) pts.push([x,y]); }
  return pts;
}

// 两章的工单顺序。地图派单、清档、收集册、结局判定都从这里取，
// 别在各处再抄一份数组——漏改一处就会出现"收集册显示 7/7 但结局不触发"这种鬼故事。
// **两章必须分开两个常量**：合并成一个的话 allRepaired() 会要求 14 处全修好，
// 第一章的小结局将永远不会触发（这是第二章最危险的一处耦合，见设计案 10.1）。
const CHAPTER1_IDS=['moon','cloud','dipper','mountain','tree','lake','sea'];
const CHAPTER2_IDS=['galaxy','meteor','ruins','dunes','oasis','cactus','camel'];
// 用 every 而不是 collection.size>=7：万一存档里混进别的 key，size 判定会误触发。
function allRepaired(){ return CHAPTER1_IDS.every(id=>collection.has(id)); }
function ch2Repaired(){ return CHAPTER2_IDS.every(id=>collection2.has(id)); }
// 按点位所在章节取它对应的收集集。reward 和所有"这处修好没有"的判断都走这里，
// 免得每处再写一遍 `POINTS[id].ch===2 ? collection2 : collection`。
function collOf(id){ return POINTS[id].ch===2 ? collection2 : collection; }
function isRepaired(id){ return collOf(id).has(id); }
// 统一的结算入口：同一处只发一次贝壳
function reward(id){
  const p=POINTS[id], c=collOf(id);
  if(c.has(id)){ lastEarn=0; return 0; }
  c.add(id); shells+=p.reward; lastEarn=p.reward; saveState(); return p.reward;
}

function tutRing(x,y,r){
  const pu=0.5+0.5*Math.abs(Math.sin(time*3));
  ctx.globalAlpha=0.35+0.65*pu; ctx.strokeStyle='#ffd43b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,r+pu*4,0,6.2832); ctx.stroke(); ctx.globalAlpha=1;
}
function tutArrow(x,y,dir){
  const bob=Math.round(Math.sin(time*4)*3);
  ctx.fillStyle='#ffd43b'; ctx.beginPath();
  if(dir==='down'){ const yy=y+bob; ctx.moveTo(x,yy+9); ctx.lineTo(x-6,yy); ctx.lineTo(x+6,yy); }
  else { const xx=x-bob; ctx.moveTo(xx+9,y); ctx.lineTo(xx,y-6); ctx.lineTo(xx,y+6); }
  ctx.closePath(); ctx.fill();
}
// 自动选位置：上方有空间就放上方，否则放左边（避免被画布顶边裁掉）
function tutMark(p){
  tutRing(p.x,p.y,p.r);
  const ay=p.y-p.r-14;
  // 默认在节点上方往下指；但左上角那块被「贝壳」计数占了，那里改成从左侧朝右指（仍指向节点）
  let ax,ayy,dir;
  if(p.y-p.r-22>12 && !(p.x<110 && ay<52)){ ax=p.x; ayy=ay; dir='down'; }
  else { ax=p.x-p.r-16; ayy=p.y; dir='right'; }
  tutArrow(ax,ayy,dir);
  return {x:ax,y:ayy,dir:dir};   // 返回箭头位置，方便回归测试查重叠
}
// 引导用。三个函数职责要分清，混用会把新人指向他做不了的地方：
//   tutUnrepaired —— 还没修的点（按固定顺序）
//   tutNextDoable —— 现在就能修的点（道具已到手）。引导③用它，绝不指一个买不起的
//   tutNextNeed  —— 下一个该修的点（不管道具）。引导②用它来告诉新人该买什么
function tutUnrepaired(){
  return ['cloud','mountain','dipper'].map(id=>POINTS[id])
    .filter(x=>x.status!=='locked' && !collection.has(x.id));
}
function tutNextDoable(){ return tutUnrepaired().find(x=>!x.need||owned[x.need]) || null; }
function tutNextNeed(){
  const l=tutUnrepaired(), q=l.find(x=>!x.need||owned[x.need]) || l[0];
  return q ? {id:q.id, tool:q.need||null} : null;
}

  if(allRepaired()&&!seenEnding())return {key:'book',text:'七处工单全部关闭，去「图鉴」完成验收。'};

function dlgCharW(ch){ return /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(ch)?1:0.56; }
function wrapText(str,maxUnits){
  const lines=[]; let cur='',w=0;
  for(const ch of str){
    const cw=dlgCharW(ch);
    if(w+cw>maxUnits && cur){ lines.push(cur); cur=''; w=0; }
    cur+=ch; w+=cw;
  }
  if(cur) lines.push(cur);
  return lines;
}

const intro={
  i:0,typed:0,t:0,shake:0,flash:0,walk:-1,ticket:0,ticketOn:false,tools:0,toolsOn:false,glow:0,
  enter(){
    this.i=0; this.typed=0; this.t=0; this.shake=0; this.flash=0;
    this.walk=-1; this.ticket=0; this.ticketOn=false; this.tools=0; this.toolsOn=false; this.glow=0;
    this.fireFx(INTRO_SCRIPT[0].fx);
    speakLine(INTRO_SCRIPT[0].text, INTRO_SCRIPT[0].who);
  },
  fireFx(fx){
    if(fx==='shake') this.shake=9;
    else if(fx==='ticket'){ this.ticketOn=true; this.ticket=0; this.toolsOn=false; }
    else if(fx==='tools'){ this.toolsOn=true; this.tools=0; this.ticketOn=false; }
    else if(fx==='glow'){ this.flash=0.6; this.glow=1; }
    else if(fx==='walk'){ this.walk=0; this.ticketOn=false; this.toolsOn=false; }
  },
  update(dt){
    this.t+=dt;
    const d=INTRO_SCRIPT[this.i];
    if(d && this.typed<d.text.length) this.typed=Math.min(d.text.length,this.typed+dt*30);
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt*36);
    if(this.flash>0) this.flash=Math.max(0,this.flash-dt*2.2);
    if(this.glow>0) this.glow=Math.max(0,this.glow-dt*0.7);
    if(this.ticketOn) this.ticket=Math.min(1,this.ticket+dt*4.5);
    if(this.toolsOn) this.tools=Math.min(1,this.tools+dt*4.5);
    // 收尾走路：原来 46/s 要走 9 秒，太快进不了戏，太慢又烦；170/s ≈ 2.4 秒，且随时可点跳过
    if(this.walk>=0){ this.walk+=dt*170; if(this.walk>W+50) this.finish(); }
  },
  draw(){
    const d=INTRO_SCRIPT[this.i];
    const speaking = d && d.who==='sys' && this.walk<0;
    drawStation(this.t, speaking?(0.55+0.45*Math.sin(this.t*3)):0);
    if(this.ticketOn) drawTicketPanel(this.ticket,this.t);
    if(this.toolsOn) drawToolsPanel(this.tools,this.t);
    // 收尾走路：小人沿地面从左往右走，提示要放在脚下方，不然会被角色踩掉
    if(this.walk>=0){
      drawWorker(this.walk,'walk',this.t,222);
      rect(W/2-32,H-13,64,12,'#05060f');
      text('点击跳过',W/2,H-4,'#8b93c7',8);
    }
    else if(d){
      drawDialogBox({who:d.who,name:d.name,text:d.text,typed:Math.floor(this.typed)},this.t);
      drawSkipBtn();
      const n=INTRO_SCRIPT.length;
      for(let i=0;i<n;i++) rect(W/2-n*4+i*8,H-4,4,2,i<this.i?'#ffd43b':'#2a3260');
    }
    if(this.flash>0){ ctx.globalAlpha=this.flash*0.32; rect(0,0,W,H,'#fff'); ctx.globalAlpha=1; }
  },
  press(){
    if(this.walk>=0){ this.finish(); return; }   // 走路阶段点哪都能跳过
    if(inRect(ptr,W-58,4,50,16)){ this.finish(); return; }
    const d=INTRO_SCRIPT[this.i]; if(!d) return;
    if(this.typed<d.text.length){ this.typed=d.text.length; return; }
    this.i++; this.typed=0;
    const nd=INTRO_SCRIPT[this.i];
    if(!nd){ this.finish(); return; }
    this.fireFx(nd.fx);
    // 收尾那句（fx:'walk'）的字幕永远不会被渲染，所以也不该念出来
    if(nd.fx!=='walk') speakLine(nd.text,nd.who); else stopSpeak();
  },
  // 教学标记同样受 FRESH 管辖：?fresh=1 是"什么都不留下"的演示模式，
  // 漏了这句守卫的话，预览一遍就会在正式地址上多出"重看开场"按钮。
  finish(){ stopSpeak(); if(!FRESH){ try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} } tut.step = tut.step>=4 ? 4 : 1; setScene('map'); }
};

// 第二章路牌。地图页和小结局的"路牌特写"共用一份画法（s 是缩放，open 是解锁态），
// 否则同一样东西在两张画面里会长得不一样。
function drawGateSign(cx,cy,s,open,t){
  const pu=0.5+0.5*Math.abs(Math.sin(t*2));
  // 光晕：未解锁是暗橙（只是指个路），解锁后转金色并更亮（"可以出发了"）
  ctx.globalAlpha=(open?0.20:0.12)+(open?0.34:0.20)*pu;
  circle(cx-8*s,cy-10*s,(GATE.r+8)*s, open?'#ffd43b':'#ffb46b'); ctx.globalAlpha=1;
  rect(cx-3*s,cy-8*s,5*s,30*s,'#6b4f2a'); rect(cx-3*s,cy-8*s,2*s,30*s,'#8a6a3c');
  rect(cx-40*s,cy-22*s,58*s,17*s,'#6b4f2a'); rect(cx-39*s,cy-21*s,56*s,15*s, open?'#d9a83f':'#a8823f');
  text('下一章',cx-16*s,cy-9*s,'#2a2010',Math.round(9*s));
  ctx.fillStyle='#2a2010'; ctx.beginPath();
  ctx.moveTo(cx+7*s,cy-16*s); ctx.lineTo(cx+13*s,cy-16*s); ctx.lineTo(cx+13*s,cy-19*s);
  ctx.lineTo(cx+18*s,cy-12*s); ctx.lineTo(cx+13*s,cy-5*s); ctx.lineTo(cx+13*s,cy-8*s); ctx.lineTo(cx+7*s,cy-8*s);
  ctx.closePath(); ctx.fill();
  // 解锁后：沿牌面走一道流光，让"能点了"这件事一眼可见
  if(open){
    const k=(t*0.5)%1, sx=cx-39*s+56*s*k;
    ctx.globalAlpha=0.85*Math.max(0,1-Math.abs(k-0.5)*1.8);
    rect(sx,cy-21*s,2.5*s,15*s,'#fff3c4'); ctx.globalAlpha=1;
  }
}

  ctx.fillStyle='#cdd9f0'; ctx.beginPath(); ctx.moveTo(wx+ww*0.20,mY-24); ctx.lineTo(wx+ww*0.25,mY-34); ctx.lineTo(wx+ww*0.30,mY-24); ctx.closePath(); ctx.fill();

const TRAIN_WX=46, TRAIN_WY=50, TRAIN_WW=268, TRAIN_WH=112;

  },
  press(){ if(tapBack()){ setScene('map'); return; }

// ---------- 修月亮（两步：拉到身边 → 充气 → 送回）----------
function sparkle(s){ for(let i=0;i<26;i++){ const a=Math.random()*6.28,sp=1+Math.random()*3; s.particles.push({x:s.moonX,y:s.moonY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:'#ffe066'}); } }
function explode(s){ for(let i=0;i<24;i++){ const a=Math.random()*6.28,sp=2+Math.random()*4; s.particles.push({x:s.moonX,y:s.moonY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:Math.random()<0.5?'#ff6b6b':'#ffa94d'}); } }
const moon={
  state:'ready', pressure:0, tMin:66, tMax:86, prog:0, bulge:0, resType:'', moonX:skyX, moonY:skyY, exploded:false, particles:[], pump:0, shake:0,
  enter(){ this.state='ready'; this.pressure=0; this.prog=0; this.bulge=0; this.resType=''; this.exploded=false; this.moonX=skyX; this.moonY=skyY; this.particles=[]; this.pump=0; this.shake=0; lastEarn=0; this.tMin=66+Math.random()*10; this.tMax=Math.min(this.tMin+12+Math.random()*6,93); },
  // 气压 → 月相进度。绿区中心正好是"满月"，越过绿区开始鼓胀偏红
  syncProg(){
    const c=(this.tMin+this.tMax)/200;
    const k=(this.pressure/100)/c;
    this.prog=Math.min(1,Math.pow(Math.max(0,k),1.3));
    this.bulge=Math.max(0,(k-1)/Math.max(0.05,1/c-1));
  },
  press(){
    if(tapBack()){ setScene('map'); return; }
    if(tapQuickNav()) return;
    if(this.state==='ready'){ this.state='pull'; SFX.grab(); }
    else if(this.state==='placed'){ this.state='charging'; this.pressure=0; this.prog=0; this.bulge=0; SFX.grab(); }
    else if(this.state==='result'){
      if(this.resType==='ok'){ this.state='return'; }
      else if(this.resType==='over'){ this.enter(); }
      else { this.state='placed'; this.pressure=0; this.prog=0; this.bulge=0; }
    }
    else if(this.state==='done'){ SFX.click(); setScene('train',{point:POINTS.moon,dir:'rev'}); }
  },
  release(){
    if(this.state==='charging'){
      if(this.pressure>=this.tMin&&this.pressure<=this.tMax){ this.state='result'; this.resType='ok'; this.prog=1; this.bulge=0; reward('moon'); sparkle(this); SFX.win(); SFX.earn(); }
      else if(this.pressure>this.tMax){ this.state='result'; this.resType='over'; this.exploded=true; this.shake=16; explode(this); SFX.miss(); }
      else { this.state='result'; this.resType='under'; this.syncProg(); SFX.deny(); }
    }
  },
  update(dt){
    if(this.state==='pull'){ if(ptr.down){ const dx=nearX-this.moonX,dy=nearY-this.moonY,d=Math.hypot(dx,dy); if(d<2){ this.moonX=nearX; this.moonY=nearY; this.state='placed'; } else { const sp=Math.min(d,120*dt); this.moonX+=dx/d*sp; this.moonY+=dy/d*sp; } } this.pump+=dt*6; }
    else if(this.state==='charging'&&ptr.down){ this.pressure+=40*dt; this.pump+=dt*9; this.syncProg(); if(this.pressure>=100){ this.pressure=100; this.release(); } }
    else if(this.state==='return'){ const dx=skyX-this.moonX,dy=skyY-this.moonY,d=Math.hypot(dx,dy); if(d<2){ this.moonX=skyX; this.moonY=skyY; this.state='done'; } else { const sp=Math.min(d,150*dt); this.moonX+=dx/d*sp; this.moonY+=dy/d*sp; } }

  },
  draw(){
    drawSky(); drawShoot(); rect(0,H-26,W,2,'#232a55');
    if(!(this.state==='result'&&this.resType==='over'&&this.exploded)){ const r=11+19*this.prog+9*this.bulge; if(this.resType==='ok'||this.state==='return'||this.state==='done'){ ctx.globalAlpha=0.22; circle(this.moonX,this.moonY,r+8,'#ffe066'); ctx.globalAlpha=1; } buildMoon(this.prog,this.bulge); ctx.drawImage(moonCv, Math.round(this.moonX-55), Math.round(this.moonY-55), 110,110); }
    if(this.state==='pull'||this.state==='charging'){ const hx=workerX+16, hy=H-34-12+Math.round(Math.sin(this.pump*5)); ctx.strokeStyle='#8b5a2b'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(this.moonX-12,this.moonY-12); ctx.stroke(); ctx.strokeStyle='#c9ccd8'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(this.moonX-12,this.moonY-12,4,-0.3,Math.PI*0.9,false); ctx.stroke(); }
    if(this.state==='charging'){ const p0=workerX+20, pt=H-34-23+Math.round(Math.sin(this.pump*9)*3); ctx.strokeStyle='#cfd2dc'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p0+4,pt-2); ctx.lineTo(p0+14,pt-9); ctx.lineTo(this.moonX-16,this.moonY+12); ctx.stroke(); }

  }

const dipper={
  state:'ready',active:-1,lastA:0,rider:{x:50,y:151},rings:[],

  for(let i=0;i<25;i++){const x=(i*37)%94-47,y=(i*19)%62-31;circle(x,y,5,i%2?'#438f62':'#367b55');}
  ctx.strokeStyle='#bc8c60';ctx.lineWidth=3;ctx.beginPath();
  const lines=[[[0,32],[0,13],[-16,-1],[-32,-6],[-48,-20]],[[0,13],[16,0],[32,-8],[48,-27]],[[-16,-1],[-12,-17],[-24,-32]],[[-32,-6],[-35,13],[-48,20]],[[16,0],[14,-15],[5,-32]],[[32,-8],[35,12],[48,23]]];
  lines.forEach(line=>line.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y)));ctx.stroke();
  [[-37,-19],[-11,-24],[28,-17],[41,19],[-41,16],[9,24]].forEach(([x,y],i)=>{ellipse(x,y,4,2,i%2?'#ffcf78':'#8bcf83');});
}
const tree={
  state:'ready',pieces:[],active:-1,gesture:null,green:0,
  enter(){ this.state='ready';this.active=-1;this.gesture=null;this.green=0;this.note='';lastEarn=0;
    const homes=[[46,108],[310,108],[46,148],[310,148],[46,188],[310,188]];
    this.demoDone=false;const order=[0,1,2,3,4,5].sort(()=>Math.random()-.5);
    this.pieces=order.map((id,i)=>({id,x:homes[i][0],y:homes[i][1],home:homes[i],rot:1+Math.floor(Math.random()*3),locked:false})); },
  target(p){return {x:148+(p.id%3)*32,y:124+Math.floor(p.id/3)*32};},
  press(){
    if(repairNav('tree')) return;
    if(this.state==='ready'){if(repairEntry('rope'))this.state='play';return;}
    this.note='';
    for(let i=this.pieces.length-1;i>=0;i--){const p=this.pieces[i];if(!p.locked&&Math.abs(ptr.x-p.x)<18&&Math.abs(ptr.y-p.y)<18){
      this.active=i;this.dragView=null;this.gesture={x:ptr.x,y:ptr.y,ox:p.x,oy:p.y,moved:false};SFX.grab();break;}}
  },
  release(){
    if(this.active<0||!this.gesture) return;
    this.demoDone=true;
    const p=this.pieces[this.active],g=this.gesture;
    if(Math.hypot(ptr.x-g.x,ptr.y-g.y)>4)g.moved=true;
    if(g.moved){p.x=Math.max(18,Math.min(342,g.ox+ptr.x-g.x));p.y=Math.max(92,Math.min(202,g.oy+ptr.y-g.y));}
    if(!g.moved){p.rot=(p.rot+1)%4;SFX.tick();}
    const t=this.target(p),closest=this.pieces.map(piece=>({id:piece.id,...this.target(piece)})).sort((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y))[0];
    if(closest.id===p.id&&Math.abs(p.x-t.x)<=21&&Math.abs(p.y-t.y)<=21){p.x=t.x;p.y=t.y;p.docked=true;if(p.rot===0){p.locked=true;SFX.ringDone();}else this.note='位置放对了，轻点上方这块树冠，把方向转正。';}
    else if(portraitMode||p.y<88||p.y>204||p.x<22||p.x>338){[p.x,p.y]=p.home;p.docked=false;if(portraitMode&&g.moved)this.note='这格的树枝接不上，再看看另一块；碎片已回到下方。';}
    this.active=-1;this.gesture=null;
    if(this.pieces.every(p=>p.locked))repairWin('tree');
  },
  update(dt){
    repairToast(dt);
    if(this.active>=0&&ptr.down&&this.gesture){const p=this.pieces[this.active],g=this.gesture;
      if(Math.hypot(ptr.x-g.x,ptr.y-g.y)>4)g.moved=true;
      if(g.moved){p.x=Math.max(18,Math.min(342,g.ox+ptr.x-g.x));p.y=Math.max(92,Math.min(202,g.oy+ptr.y-g.y));}}
    if(this.state==='win')this.green=Math.min(1,this.green+dt);
  },
  drawPiece(p){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/2);
    ctx.beginPath();ctx.rect(-16,-16,32,32);ctx.clip();
    ctx.translate(32-(p.id%3)*32,16-Math.floor(p.id/3)*32);crownArt();ctx.restore();
    ctx.strokeStyle=p.locked?'#79d8b5':this.pieces[this.active]===p?'#ffd43b':'#89b7a4';ctx.lineWidth=1;ctx.strokeRect(p.x-16,p.y-16,32,32);
  },
  draw(){
    drawSky();rect(0,205,360,35,'#203b32');
    [85,275].forEach(x=>drawTreeAt(x,207,.9,this.green));
    rect(176,159,8,47,'#8b644c');
    ctx.save();ctx.translate(180,140);ctx.globalAlpha=.23;crownArt();ctx.restore();
    for(let i=0;i<6;i++){ctx.strokeStyle='#657e77';ctx.strokeRect(132+(i%3)*32,108+Math.floor(i/3)*32,32,32);}
    this.pieces.forEach((p,i)=>{if(i!==this.active)this.drawPiece(p);});if(this.active>=0&&!portraitMode)this.drawPiece(this.pieces[this.active]);
    if(this.state==='ready')drawBtn(124,76,112,18,'打开树冠修补包','#4b7b76');
    if(this.state==='play'&&!this.demoDone&&!portraitMode){const p=this.pieces.find(p=>!p.locked);if(p){tutRing(p.x,p.y,19);text('轻点旋转',p.x,p.y+29,'#ffe2a0',8);}}
    if(this.state==='win'){circle(191,106,4,'#ffd475');rect(190,106,2,2,'#2a2f5a');rect(193,108,5,2,'#f5b4ae');}
    repairProgress(this.pieces.filter(p=>p.locked).length/6,'点击碎片旋转 · 按住拖动 · 树枝接通后自动归位');
    repairHeader('修森林',this.state==='ready'?'点击打开树冠修补包':this.state==='play'?'拼回六块树冠，让树枝重新接起来':'小鸟回家了，森林又绿了！'+(lastEarn?' +'+lastEarn:'  已维修'),this.state==='win'?'点击乘列车返回':'没有次数限制 · 对照树枝和叶片寻找位置');toastDraw();
  }
};

// Lake Foley audio: filtered noise for water flow plus tiny droplet resonances.
const waterAudio={
  source:null,gain:null,filter:null,pan:null,level:0,
  ensure(){if(this.source)return;const ac=actx();if(!ac)return;
    const buffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),a=buffer.getChannelData(0);
    let smooth=0;for(let i=0;i<a.length;i++){smooth=(smooth+Math.random()*2-1)*.96;a[i]=smooth*.2;}
    this.source=ac.createBufferSource();this.source.buffer=buffer;this.source.loop=true;
    this.filter=ac.createBiquadFilter();this.filter.type='lowpass';this.filter.frequency.value=1400;
    this.gain=ac.createGain();this.gain.gain.value=0;
    this.source.connect(this.filter);this.filter.connect(this.gain);
    if(ac.createStereoPanner){this.pan=ac.createStereoPanner();this.gain.connect(this.pan);this.pan.connect(ac.destination);}else this.gain.connect(ac.destination);
    this.source.start();
  },
  set(level,x=.5){this.level=level;if(level>0&&!muted)this.ensure();const ac=actx();if(this.gain&&ac){this.gain.gain.setTargetAtTime(muted?0:level,ac.currentTime,.08);if(this.pan)this.pan.pan.setTargetAtTime((x-.5)*1.2,ac.currentTime,.1);}},
  stop(){this.set(0);},
  drop(){tone(680+Math.random()*500,.12,'sine',.018);tone(320+Math.random()*110,.1,'sine',.012);}
};
const lake={
  state:'ready',fill:0,stroke:0,lastP:null,ripples:[],dropT:0,listen:false,

  press(){

    ctx.save();ctx.translate(77,123);if(this.state==='pour'&&ptr.down&&inRect(ptr,49,95,55,57))ctx.rotate(.48);drawKettle(0,0);ctx.restore();

    text('水壶',76,162,'#b3d9df',8);

    toastDraw();

// ---------- 修大海（划水：跟着浪的节拍滑动，把潮位推起来）----------
// 破损态是"潮汐停了"——海面平静得像一块铁板。玩家顺着浪涌来的方向滑动，
// 每划一桨潮位涨一格，推满 = 海重新起伏呼吸。
// 节拍提示以视觉为主（静音也能玩），音效只是辅助。
const SEA_LINE=180, SEA_PERFECT=15, SEA_GOOD=32, SEA_TOP=118, SEA_BOT=210;
// 潮位增益：5 桨打满。全 perfect 5 次（0.22×5=1.10）、全 good 7 次，混着来约 5~6 次。
// 旧值是 0.10 / 0.06 —— 就算桨桨完美也要划 10 次，节奏拖沓、划到手酸。
const SEA_GAIN_PERFECT=0.22, SEA_GAIN_GOOD=0.15;
const sea={
  state:'ready', waves:[], tide:0, combo:0, hit:0, miss:0, spawnT:0, beat:0, gesture:null, flash:0, swing:0,
  enter(){
    this.state='ready'; this.waves=[]; this.tide=0; this.combo=0; this.hit=0; this.miss=0;
    this.spawnT=0.7; this.beat=0; this.gesture=null; this.flash=0; this.swing=0;this.feedback='';this.feedbackT=0; lastEarn=0;
  },
  pushWave(dir){
    let best=null, bd=1e9;
    this.waves.forEach(w=>{ if(w.judged||w.dir!==dir) return; const d=Math.abs(w.x-SEA_LINE); if(d<bd){ bd=d; best=w; } });
    this.feedbackT=1.8;if(!best){this.feedback='看浪头的箭头，顺着它的方向划。';return;}
    best.judged=true;
    if(bd<=SEA_PERFECT){ best.ok='perfect'; this.hit++; this.combo++; this.tide=Math.min(1,this.tide+SEA_GAIN_PERFECT); this.flash=1; this.swing=1; SFX.perfect(); }
    else if(bd<=SEA_GOOD){ best.ok='good'; this.hit++; this.combo++; this.tide=Math.min(1,this.tide+SEA_GAIN_GOOD); this.swing=1; SFX.good(); }
    // 划空也给一点摆动：桨从水里划过去、什么都没碰到，比"桨不动"更像回事
    else { best.ok='miss'; this.miss++; this.combo=0; this.swing=0.55; SFX.miss(); }
    this.feedback=best.ok==='perfect'?'正好！这一桨让潮水涨起来了。':best.ok==='good'?'划到了，再接下一道浪。':(best.dir>0?best.x<SEA_LINE:best.x>SEA_LINE)?'稍早了，等浪靠近金线再划。':'稍晚了，松手准备下一道浪。';
    if(this.tide>=1){ this.state='win'; reward('sea'); SFX.win(); SFX.earn(); }
  },
  press(){
    if(tapBack()){ setScene('map'); return; }
    if(tapQuickNav()) return;
    if(this.state==='ready'){ if(owned.paddle){ this.state='play'; SFX.grab(); } else { SFX.deny(); toast={text:'需要「一根船桨」，去商店买',t:2.4}; } return; }
    if(this.state==='play'){ this.gesture={x:ptr.x,y:ptr.y,used:false}; return; }
    if(this.state==='win'){ SFX.click(); setScene('train',{point:POINTS.sea,dir:'rev'}); }
  },
  release(){ this.gesture=null; },
  update(dt){
    if(this.flash>0) this.flash=Math.max(0,this.flash-dt*3);
    if(this.feedbackT>0)this.feedbackT=Math.max(0,this.feedbackT-dt);
    if(this.swing>0) this.swing=Math.max(0,this.swing-dt*3.4);
    // 滑动判定：一次按下-拖动-抬起只算一桨（天然限速，防止乱滑刷分）
    if(this.state==='play' && this.gesture && !this.gesture.used && ptr.down){
      const dx=ptr.x-this.gesture.x, dy=ptr.y-this.gesture.y;
      if(Math.abs(dx)>=14 && Math.abs(dx)>Math.abs(dy)*1.2){ this.gesture.used=true; this.pushWave(dx>0?1:-1); }
    }
    if(this.state==='play'){
      this.spawnT-=dt;
      if(this.spawnT<=0){
        this.spawnT=1.15; this.beat++;
        const dir=(this.beat%2===0)?1:-1;
        this.waves.push({x:dir>0?-24:W+24, dir:dir, judged:false, ok:null, a:1});
        tone(240,0.06,'square',0.035);   // 拍点
      }
      this.waves.forEach(w=>{ w.x+=w.dir*95*dt; if(w.judged) w.a-=dt*1.6; });
      this.waves.forEach(w=>{ if(!w.judged && (w.dir>0? w.x>W+30 : w.x<-30)){ w.judged=true; w.ok='miss'; w.a=1; this.miss++; this.combo=0; } });
      this.waves=this.waves.filter(w=>w.a>0 || !w.judged);
    } else if(this.state==='win'){
      this.waves.forEach(w=>{ w.a-=dt*0.6; });
      this.waves=this.waves.filter(w=>w.a>0);
      this.tide=Math.min(1,this.tide+dt*0.05);
    }
  },
  draw(){
    drawSky(); drawShoot(); drawBack(); drawQuickNav();
    text('修大海',W/2,16,'#ff8fab',11); shellTag(time, W/2-32, 34);
    // 海面：潮位越高越往上、越亮
    const sur=112+(1-this.tide)*14;
    ctx.fillStyle=rgb(mix([9,18,42],[14,40,82],this.tide)); ctx.fillRect(0,sur,W,H-sur);
    ctx.fillStyle='#1b3a66'; ctx.fillRect(0,sur,W,2);
    ctx.strokeStyle='rgba(143,211,255,0.30)'; ctx.lineWidth=1;
    for(let k=0;k<4;k++){ ctx.beginPath(); for(let xx=0;xx<=W;xx+=6){ const yy=sur+22+k*24+Math.sin((xx+time*40+k*30)/18)*3; if(xx===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); } ctx.stroke(); }
    if(this.state==='play'||this.state==='ready'){
      const g=Math.abs(Math.sin(time*4));
      ctx.globalAlpha=0.12; ctx.fillStyle='#4ade80'; ctx.fillRect(SEA_LINE-SEA_GOOD,SEA_TOP,SEA_GOOD*2,SEA_BOT-SEA_TOP); ctx.globalAlpha=1;
      ctx.globalAlpha=0.16+0.14*g; ctx.fillStyle='#ffd43b'; ctx.fillRect(SEA_LINE-SEA_PERFECT,SEA_TOP,SEA_PERFECT*2,SEA_BOT-SEA_TOP); ctx.globalAlpha=1;
      ctx.strokeStyle='#ffd43b'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(SEA_LINE,SEA_TOP); ctx.lineTo(SEA_LINE,SEA_BOT); ctx.stroke(); ctx.setLineDash([]);
    }
    const visibleWaves=this.state==='ready'?[{x:(time*65)%408-24,dir:1,judged:false}]:this.waves;
    visibleWaves.forEach(w=>{
      const col=!w.judged?'#8fd3ff':(w.ok==='perfect'?'#ffd43b':(w.ok==='good'?'#4ade80':'#ff6b6b'));
      ctx.globalAlpha=w.judged?Math.max(0,w.a):1;
      ctx.strokeStyle=col; ctx.lineWidth=w.judged?2:3;
      ctx.beginPath();
      for(let y=SEA_TOP;y<=SEA_BOT;y+=4){ const xx=w.x+Math.sin((y+time*90)/15)*5; if(y===SEA_TOP) ctx.moveTo(xx,y); else ctx.lineTo(xx,y); }
      ctx.stroke();
      // 方向箭头：顺着浪前进的方向划
      ctx.fillStyle=col;
      const ax=w.x+w.dir*13, ay=SEA_TOP+8;
      ctx.beginPath(); ctx.moveTo(ax,ay-6); ctx.lineTo(ax+w.dir*9,ay); ctx.lineTo(ax,ay+6); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    });
    if(this.flash>0){ ctx.globalAlpha=this.flash*0.16; rect(0,0,W,H,'#ffd43b'); ctx.globalAlpha=1; }
    // 小船 + 工人
    const wx=22, wy=H-48;
    ctx.fillStyle='#6b4f2a'; ctx.beginPath(); ctx.moveTo(wx-16,wy+8); ctx.lineTo(wx+24,wy+8); ctx.lineTo(wx+17,wy+18); ctx.lineTo(wx-9,wy+18); ctx.closePath(); ctx.fill();
    // 船桨握在手里。以前只在商店/背包里画过桨，海上没画 —— 工人空着手在那儿划水。
    // 画在工人**之前**：桨杆上段被头/手臂压住，看起来才像"握着"，而不是贴在身前。
    // 桨杆中心落在手掌高度上，桨叶探出右舷入水。
    // 划桨时用 sin 做持续小幅摆动（桨在水里来回划），命中/失误再叠一次 swing 大幅挥动，
    // 让每一次操作都有即时手感。
    const paddling=(this.state==='play'||this.state==='win');
    const pAng=-0.55 - (paddling ? Math.sin(time*4.5)*0.17 + this.swing*0.42 : 0);
    drawPaddleShape(wx+21, wy-1, pAng, 0.82);
    drawWorker(wx, this.state==='play'?'wash':'idle', time, wy);
    // 潮位计
    const bx=40,by=H-16,bw=W-80,bh=9;
    rect(bx-2,by-2,bw+4,bh+4,'#05060f'); rect(bx,by,bw,bh,'#1b2148');
    rect(bx,by,bw*this.tide,bh, this.tide>=1?'#4ade80':'#ffd43b');
    // "还差 N 桨"按 perfect 增益估算：5 桨打满，玩家心里有数，不会觉得怎么划都划不完
    const left=(this.state==='play') ? '   还差 '+Math.ceil((1-this.tide)/SEA_GAIN_PERFECT)+' 桨' : '';

// ---------- 第二章过渡剧情（湖泊 → 大海 → 沙漠）----------
// 第一章最后两处（湖泊、大海）都是水，第二章最缺的也是水。所以过渡不靠换场，靠"水自己流过去"：
//   湖泊蓄满 → 海水回来 → 水往低处走 → 顺着水流到沙漠 → 沙漠没有水
// 主角不是"决定去沙漠"，他/她是被水带过去的。第一章最后买的那根船桨因此有了第二次用途。
// 框架完全沿用第一章 intro（打字机 + 说话人色条 + 语音合成），只换背景和脚本。
const CH2_SCRIPT=[
  {who:'sys',name:'地球 ONLINE',text:'大海工单已关闭。潮水，回来了。',stage:'sea'},
  {who:'you',name:'你',text:'（把桨横在膝上）湖泊的水声回来了，海也涨潮了。',stage:'sea'},
  {who:'sys',name:'地球 ONLINE',text:'顺着水走，就知道下一站在哪。',stage:'drift'},
  {who:'you',name:'你',text:'喂——我没划啊。',stage:'drift'},
  {who:'sys',name:'地球 ONLINE',text:'不用划。它比您熟路。',stage:'drift'},
  {who:'sys',name:'地球 ONLINE',text:'新工单：沙漠。水把您送到这里，自己先退下了。',stage:'shore'},
  {who:'prince',name:'小王子',text:'你的船走到没有水的地方了。',stage:'shore'},
  {who:'you',name:'你',text:'你是谁？这里连海都没有。',stage:'shore'},
  {who:'prince',name:'小王子',text:'叫我小王子吧。刚才看见你的船搁浅，就过来帮忙。',stage:'shore'},
  {who:'you',name:'你',text:'看来只能停在这里了。',stage:'shore'},
  {who:'sys',name:'',text:'他扶住晃动的船，帮你拉开船帆。刚修好的月亮，把光落进帆里。',stage:'shore'},
  {who:'you',name:'你',text:'……月光也能开船？',stage:'shore'},
  {who:'prince',name:'小王子',text:'你可以再试一下。',stage:'shore'},
  {who:'prince',name:'小王子',text:'我在找一口井。我们可以同路一段。',stage:'shore'},
  {who:'you',name:'你',text:'好啊。桨这次当船桅，别留在沙里了。',stage:'shore'}
];
// 过渡剧情的背景。prog 0→1 = 从"夜海中央"漂到"沙岸搁浅"。
// 水色一路变浅（深蓝 → 青灰 → 沙黄），观众肉眼看到"水越来越少了"——这就是过渡本身，
// 不需要任何一句台词去解释。所以 prog 必须连续插值，硬切背景会把这个效果毁掉。
function drawCh2Bg(prog,t){
  const p=Math.max(0,Math.min(1,prog));
  // 天空：夜紫 → 沙尘色（快靠岸时天光开始泛沙）
  rect(0,0,W,88,rgb(mix([10,14,36],[46,32,58],p)));
  rect(0,88,W,H-88,rgb(mix([22,36,74],[74,50,66],p)));
  for(let i=0;i<26;i++){ const sx=(i*97)%W, sy=(i*43)%84; px(sx,sy, i%6===0?'#ffd6f0':'#c8d6ff'); }
  buildMoon(1); ctx.globalAlpha=0.92; ctx.drawImage(moonCv,W-80,18,28,28); ctx.globalAlpha=1;
  // 海面：随 p 下沉，颜色变浅变灰
  const seaTop=118+Math.round(p*44);
  rect(0,seaTop,W,H-seaTop,rgb(mix([14,38,86],[70,86,104],p)));
  for(let k=0;k<5;k++){ const yy=seaTop+7+k*9; ctx.globalAlpha=0.30-0.05*k; rect(W-72-k*5,yy,24+k*9,1.6,'#cfe3ff'); ctx.globalAlpha=1; }
  // 沙岸：p 过半之后从底部升起来
  const sp=Math.max(0,(p-0.42)/0.58);
  if(sp>0){
    const shoreY=H-Math.round(sp*52);
    rect(0,shoreY,W,H-shoreY,rgb(mix([96,74,44],[168,132,80],sp)));
    rect(0,shoreY,W,2,rgb(mix([132,104,62],[196,158,98],sp)));
  }
  // 船：从左漂到中间，靠岸后搁浅在沙上
  const bx=44+p*(W*0.52-44);
  const by=(p<0.9 ? seaTop+12 : H-62);
  ctx.fillStyle='#4a3520'; ctx.beginPath();
  ctx.moveTo(bx-22,by); ctx.lineTo(bx+22,by); ctx.lineTo(bx+15,by+11); ctx.lineTo(bx-15,by+11); ctx.closePath(); ctx.fill();
  rect(bx-22,by-2,44,3,'#6b4f2a');
  // 桨横在船上（就是第一章最后买的那根）
  ctx.save(); ctx.translate(bx+16,by-4); ctx.rotate(-0.5);
  rect(-2,-14,4,22,'#b07a45'); ctx.fillStyle='#c8a165';
  ctx.beginPath(); ctx.ellipse(0,10,6,8,0,0,6.29); ctx.fill(); ctx.restore();
  if(p>.8&&ch2intro.i>=CH2_SCRIPT.findIndex(d=>d.text.includes('扶住晃动的船'))){drawSandBoat(bx,by,t,.8);}else{drawWorker(bx-5,'idle',t,by-3);if(p>.8&&ch2intro.i>=CH2_SCRIPT.findIndex(d=>d.who==='prince'))drawPrince(bx+28,by+8,.8,t);}
}
const ch2intro={
  i:0,typed:0,t:0,shake:0,walk:-1,stageP:0,
  enter(){
    this.i=0; this.typed=0; this.t=0; this.shake=0; this.walk=-1; this.stageP=0;
    this.fireFx(CH2_SCRIPT[0].fx);
    speakLine(CH2_SCRIPT[0].text, CH2_SCRIPT[0].who);
  },
  stageOf(s){ return s==='sea' ? 0 : (s==='drift' ? 0.5 : 1); },
  fireFx(fx){
    if(fx==='shake') this.shake=9;
    else if(fx==='walk') this.walk=0;
  },
  update(dt){
    this.t+=dt;
    const d=CH2_SCRIPT[this.i];
    if(d && this.typed<d.text.length) this.typed=Math.min(d.text.length,this.typed+dt*30);
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt*36);
    // 背景进度朝目标 stage 靠拢，不硬切
    const tp=this.stageOf(d?d.stage:'shore');
    this.stageP += Math.max(-dt*0.5, Math.min(dt*0.5, tp-this.stageP));
    if(this.walk>=0){ this.walk+=dt*170; if(this.walk>W+50) this.finish(); }
  },
  draw(){
    const d=CH2_SCRIPT[this.i];
    drawCh2Bg(this.stageP,this.t);
    // 收尾走路：小人沿沙岸从左往右走，提示放脚下方，不然会被角色踩掉
    if(this.walk>=0){
      drawWorker(this.walk,'walk',this.t,H-36);
      rect(W/2-32,H-13,64,12,'#05060f');
      text('点击跳过',W/2,H-4,'#8b93c7',8);
    } else if(d){
      drawDialogBox({who:d.who,name:d.name,text:d.text,typed:Math.floor(this.typed)},this.t);
      drawSkipBtn();
      const n=CH2_SCRIPT.length;
      for(let i=0;i<n;i++) rect(W/2-n*4+i*8,H-4,4,2,i<this.i?'#ffd43b':'#2a3260');
    }
  },
  press(){
    if(this.walk>=0){ this.finish(); return; }   // 走路阶段点哪都能跳过
    if(inRect(ptr,W-58,4,50,16)){ this.finish(); return; }
    const d=CH2_SCRIPT[this.i]; if(!d) return;
    if(this.typed<d.text.length){ this.typed=d.text.length; return; }
    this.i++; this.typed=0;
    const nd=CH2_SCRIPT[this.i];
    if(!nd){ this.finish(); return; }
    this.fireFx(nd.fx);
    // 收尾那句（fx:'walk'）的字幕永远不会被渲染，所以也不该念出来
    if(nd.fx!=='walk') speakLine(nd.text,nd.who); else stopSpeak();
  },
  finish(){ stopSpeak(); markCh2(); setScene('desert'); }
};

const SUB_Y=H-26;   // 窄字幕条的上沿：26px 高，底部留给进度线
function subW(s,sz){ let w=0; for(const ch of s) w+=dlgCharW(ch)*sz; return w; }

// 直接读 d.typed 会得到 undefined → slice(0,NaN) → 正文整段消失（只剩说话人）。
function drawEndSub(d,typed,t){
  const isSys=d.who==='sys';
  ctx.fillStyle='rgba(5,6,15,0.90)'; ctx.fillRect(0,SUB_Y,W,H-SUB_Y);

const ending={

    if(scene==='tree'){const v=tree.dragView||{x:mobileFinger.x,y:mobileFinger.y,w:78,h:78};const w=v.w*36/32,h=v.h*36/32;c.drawImage(pixelCanvas,a[0]*u,a[1]*u,a[2]*u,a[3]*u,v.x-w/2,v.y-h/2,w,h);}
    else{const origin=mobileGesture?.region,g=ruins.gesture;const v=ruins.dragView||{x:mobileFinger.x-(g?.dx||0)*(origin?.w||1)/(origin?.sw||1),y:mobileFinger.y-(g?.dy||0)*(origin?.h||1)/(origin?.sh||1),w:origin?.w||95,h:origin?.h||67};c.drawImage(pixelCanvas,a[0]*u,a[1]*u,a[2]*u,a[3]*u,v.x-v.w/2,v.y-v.h/2,v.w,v.h);}c.restore();
  }
  c.fillStyle='#a7bbd7';c.font='22px sans-serif';c.textAlign='center';c.fillText('☰',332,29);
  mobileRegions.push({x:310,y:2,w:48,h:44,action(){mobileLayoutChanged();mobileSettings=true;waterAudio.stop();bgmStop();stopSpeak();}});
  if(!mobileSettings)return;
  c.fillStyle='rgba(8,15,33,.97)';c.fillRect(0,0,360,P);mobileRegions=[];
  const titleY=Math.min(115,P*.17),startY=Math.min(205,P*.3);c.fillStyle='#ffe2a0';c.font='bold 22px -apple-system,"PingFang SC",sans-serif';c.fillText('休息一下',180,titleY);
  c.fillStyle='#bfcee4';c.font='14px sans-serif';c.fillText('进度留在这里，回来接着修。',180,titleY+33);
  ['音效','背景音乐','剧情配音'].forEach((label,i)=>{const y=startY+i*Math.min(67,(P-220)/4);c.fillStyle='#344e77';c.fillRect(24,y,312,48);c.fillStyle='#eef2fa';c.font='16px sans-serif';c.fillText(label+'　'+([!muted,bgmOn,voiceOn][i]?'开':'关'),180,y+31);mobileRegions.push({x:24,y,w:312,h:48,action(){ptr.x=TGL_X0_LEFT+i*62+25;ptr.y=12;tapToggles(TGL_X0_LEFT);bgmStop();}});});
  const audioY=startY+3*Math.min(67,(P-220)/4);c.fillStyle='#426577';c.fillRect(24,audioY,312,44);c.fillStyle='#e8eadb';c.font='14px sans-serif';c.fillText('声音检查与试听',180,audioY+28);mobileRegions.push({x:24,y:audioY,w:312,h:44,action:openAudioPanel});
  const y=P-76;c.fillStyle='#567b97';c.fillRect(24,y,312,48);c.fillStyle='#fff';c.fillText('继续维修',180,y+31);mobileRegions.push({x:24,y,w:312,h:48,action(){mobileSettings=false;mobileGesture=null;gameFocused=true;bgmSync();}});c.font='10px sans-serif';c.fillStyle='#8fa2be';c.fillText(BUILD,180,P-10);
};

window.mobileLayoutReady=true;
// 旅人对白和普通剧情共用配音，不在补全打字时重播，切到下一句才播放。
for(const dialogue of [travelerIntro,travelerWait,carpetDeparture]){const enter=dialogue.enter,press=dialogue.press;dialogue.enter=function(...args){const oldScene=scene;enter.apply(this,args);if(scene!==oldScene)return;const d=this.lines[this.i];if(d)speakLine(d[2],d[0]);};dialogue.press=function(...args){const before=this.i,oldScene=scene;press.apply(this,args);if(scene===oldScene&&this.i!==before){const d=this.lines[this.i];if(d)speakLine(d[2],d[0]);}};}
const SCENES={start,intro,map,train,moon,cloud,mountain,dipper,tree,lake,sea,shop,bag,book,preview,ending,ch2intro,desert,sandboat,desertEnding,desertMemory,polarPreview,travelerIntro,travelerWait,carpetDeparture,carpetChoice,carpetVoyage,...DESERT_GAMES};
// BGM 跟着场景换气质：地图/剧情/菜单是"夜里慢慢走"，关卡里加低频脉冲给推进感
const CALM_SCENES={start:1,intro:1,map:1,train:1,shop:1,bag:1,book:1,preview:1,ending:1,ch2intro:1,desert:1,sandboat:1,desertEnding:1,desertMemory:1,polarPreview:1,travelerIntro:1,travelerWait:1,carpetDeparture:1,carpetChoice:1,carpetVoyage:1};
// keep=true 表示"回到原场景但不重置"（用于从商店/背包返回关卡，保留进度）
function setScene(n,param,keep){
  if(DESERT_GAMES[n]&&!canEnterDesertPoint(n)){if(scene!=='desert'){setScene('desert');canEnterDesertPoint(n);}return;}
  if(typeof DESERT_GAMES!=='undefined' && DESERT_GAMES[scene]) DESERT_GAMES[scene].cancel();
  stopSpeak();   // 先打断上一幕的语音，再让新场景自己决定要不要开口（顺序反了会把新台词掐掉）
  waterAudio.stop();
  if(scene==='tree'){tree.active=-1;tree.gesture=null;}
  if(scene==='dipper')dipper.active=-1;
  if(scene==='mountain')mountain.release();
  if(scene==='lake')lake.lastP=null;
  ptr.down=false;
  scene=n; toast=null;if(n==='ruins'&&!keep)mobileTrayPage=0; if(!keep && SCENES[n].enter) SCENES[n].enter(param); fade=1;
  bgmMood = CALM_SCENES[n] ? 'calm' : 'busy';
  if(n==='lake'||n==='desertEnding'||n==='desertMemory') bgmStop(); else if(bgmOn) bgmStart();
}
function updatePtr(e,begin=false){if(portraitMode)return mobilePointer(e,begin);const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)*(W/r.width);ptr.y=(e.clientY-r.top)*(H/r.height);return true;}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); if(e.isPrimary===false)return; gameFocused=true;if(!updatePtr(e,true))return;ptr.down=true;try{cv.setPointerCapture(e.pointerId);}catch(_){} unlockAudio(); if(SCENES[scene].press) SCENES[scene].press(); });
window.addEventListener('pointerup', e=>{ if(e.isPrimary===false||!ptr.down)return;updatePtr(e);ptr.down=false;if(SCENES[scene].release)SCENES[scene].release();mobileGesture=null; });
window.addEventListener('pointercancel', e=>{ if(e.isPrimary===false)return;pauseInput(); });
cv.addEventListener('pointermove', e=>{ if(e.isPrimary===false)return; updatePtr(e);if(!ptr.down||mobileSettings||orientationHintOpen||audioPanelOpen)return;if(scene==='ruins'&&ruins.brush<3)ruins.brushStep();if(scene==='cactus'&&cactus.active>=0)cactus.tick(0); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown', e=>{if(orientationHintOpen||audioPanelOpen||mobileSettings)return;if(e.code==='Space'){ e.preventDefault(); if(e.repeat)return; ptr.down=true;unlockAudio();if(SCENES[scene].press) SCENES[scene].press(); } });
window.addEventListener('keyup', e=>{if(orientationHintOpen||audioPanelOpen||mobileSettings)return;if(e.code==='Space'){ e.preventDefault();ptr.down=false;if(SCENES[scene].release) SCENES[scene].release(); } });
function pauseInput(){if(DESERT_GAMES[scene])DESERT_GAMES[scene].cancel();gameFocused=false;ptr.down=false; if(scene==='tree'){tree.active=-1;tree.gesture=null;}if(scene==='dipper')dipper.active=-1;if(scene==='mountain')mountain.release();if(scene==='lake'){lake.lastP=null;}waterAudio.stop();bgmStop();}
window.addEventListener('blur',pauseInput);
function recoverGameAudio(){gameFocused=true;if(!audioHasUserGesture||muted&&!bgmOn&&!voiceOn)return;resumeAudio(false,true).then(ok=>{if(ok)bgmSync();});}
window.addEventListener('focus',recoverGameAudio);
window.addEventListener('pageshow',recoverGameAudio);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseInput();else recoverGameAudio();});
window.addEventListener('touchend',()=>{if(gameFocused&&!orientationHintOpen&&!audioPanelOpen&&(muted===false||bgmOn))unlockAudio();},{passive:true});

// ---------- 主循环 ----------
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;if(document.hidden||now<mobileFreeze||mobileSettings||orientationHintOpen||audioPanelOpen)dt=0;time+=dt;
  let s=SCENES[scene]; if(s.update&&!document.hidden&&!mobileSettings&&!orientationHintOpen&&!audioPanelOpen&&now>=mobileFreeze)s.update(dt); s=SCENES[scene];
  // 重置绘制状态与像素，不能只清除逻辑坐标中的一条区域。
  if(ctx.reset)ctx.reset();else{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,pixelCanvas.width,pixelCanvas.height);}
  ctx.setTransform(pixelCanvas.width/W,0,0,pixelCanvas.height/H,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=false;
  ctx.save();
  const sh=s.shake||0;
  if(sh>0) ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
  mobileText=[];mobileStoryCaptured=false;s.draw(); ctx.restore();
  if(fade>0){ ctx.globalAlpha=fade; rect(0,0,W,H,'#05060f'); ctx.globalAlpha=1; fade=Math.max(0,fade-dt*3.2); }
  if(portraitMode)mobileFrame();else{screenCtx.setTransform(1,0,0,1,0,0);screenCtx.globalAlpha=1;screenCtx.globalCompositeOperation='copy';screenCtx.imageSmoothingEnabled=false;screenCtx.drawImage(pixelCanvas,0,0,cv.width,cv.height);screenCtx.globalCompositeOperation='source-over';}
  requestAnimationFrame(loop);
}
loadState();
if(DESERT_PREVIEW)navReturn='desert';
// 预览直达：把七处标成已修好（顺带把道具也发齐，方便在商店/背包里看满页的样子）。
// tut.step 直接推到 4，否则地图会以为还在新手引导、多弹一条"引导结束"。
if(PREVIEW_FULL){
  CHAPTER1_IDS.forEach(id=>{ collection.add(id); const n=POINTS[id].need; if(n) owned[n]=true; });
  tut.step=4; tut.target=null;
}
// ?sea=1：只把船桨发到手上，七处工单保持未修 —— 看到的就是"第一次进大海"的样子。
// tut.step 同样推到 4，免得地图那套新手引导在背后多算一轮。
if(PREVIEW_SEA){ owned.paddle=true; tut.step=4; tut.target=null; }
// ?lake=1：只发拟音箱，七处工单保持未修。
if(PREVIEW_LAKE){ owned.lotus=true; tut.step=4; tut.target=null; }
// ?tree=1：只发树冠修补包。
if(PREVIEW_TREE){ owned.rope=true; tut.step=4; tut.target=null; }
if(PREVIEW_MOUNTAIN){owned.icecream=true;tut.step=4;tut.target=null;}
if(PREVIEW_DIPPER){owned.rocket=true;tut.step=4;tut.target=null;}
// ?ch2=1 / ?desert=1：过渡剧情的语境是"第一章刚验收完"，所以七处要标成已修；
// 沙漠地图同理（不然从路牌回去会看到一片没修好的夜空）。
// 两个都只改内存，FRESH 已经把存档写口封死了。
if(PREVIEW_CH2 || PREVIEW_DESERT){
  CHAPTER1_IDS.forEach(id=>{ collection.add(id); const n=POINTS[id].need; if(n) owned[n]=true; });
  // 第一章收支恒定（28 - 65 + 97 = 60），玩家真打过来时手上一定是这个数。
  // 预览里也给一样的值，否则商店看着"什么都买不起"，判断不了定价合不合理。
  shells=60;
  tut.step=4; tut.target=null;
}

if(DESERT_PREVIEW){
  CHAPTER1_IDS.forEach(id=>collection.add(id)); tut.step=4; shells=60;
  if(/[?&]shop2=1/.test(location.search))shells=200;
  else CHAPTER2_IDS.forEach(id=>owned[POINTS[id].need]=true);
  if(new URLSearchParams(location.search).get('play2')==='ruins')SIDE_REPAIRS.forEach(id=>collection2.add(id));
  if(/[?&](album2|final2|memory2)=1/.test(location.search))CHAPTER2_IDS.forEach(id=>collection2.add(id));
  if(/[?&]memory2=1/.test(location.search))desertEndingSeen=true;
}
setScene(/[?&]shop2=1/.test(location.search)?'shop':/[?&]memory2=1/.test(location.search)?'desertMemory':/[?&]final2=1/.test(location.search)?'desertEnding':/[?&]album2=1/.test(location.search)?'book':DESERT_PREVIEW&&CHAPTER2_IDS.includes(new URLSearchParams(location.search).get('play2'))?new URLSearchParams(location.search).get('play2'):PREVIEW_MOUNTAIN ? 'mountain'
  : PREVIEW_DIPPER ? 'dipper'
  : PREVIEW_SEA ? 'sea'
  : PREVIEW_LAKE ? 'lake'
  : PREVIEW_TREE ? 'tree'
  : PREVIEW_CH2 ? 'ch2intro'
  : PREVIEW_DESERT ? 'desert'
  : PREVIEW_ENDING ? 'ending'
  : PREVIEW_FULL ? 'map' : 'start');
requestAnimationFrame(loop);
</script>
</body>
